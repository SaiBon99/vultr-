name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (frontend, crawl backend, contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend checks (lint, format, types, unit tests, tokens, record)
        working-directory: frontend
        run: pnpm run check:unified

      - name: Frontend browser tests (smoke, accessibility)
        working-directory: frontend
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run test:e2e
          pnpm run test:a11y

      - name: Frontend build for the VM (live, same origin)
        working-directory: frontend
        env:
          PUBLIC_API_MODE: live
          PUBLIC_API_BASE: /
        run: pnpm run build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-build
          path: frontend/build
          if-no-files-found: error
          retention-days: 7

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.13.10"

      - name: Backend install
        working-directory: backend
        run: uv sync --frozen

      - name: Backend lint (crawl code)
        working-directory: backend
        # app/gate.py has a pre-existing E501 on main (Phase 1 code); scope lint to the crawl path until it is fixed.
        run: uv run ruff check app/crawl app/routes/crawl.py app/models.py app/config.py app/main.py tests/test_crawl_sandbox.py

      - name: Build the crawler sandbox image
        # The Docker-marked test skips without this image, so build it here and let the test run for real.
        run: docker build -t memory-quarantine-crawler:latest backend/sandbox

      - name: Backend crawl tests (includes the real container run)
        working-directory: backend
        run: uv run pytest -q -k crawl

      - name: Contracts
        run: uv run --no-project --with jsonschema --with pyyaml --with cryptography python contracts/check_contracts.py
        working-directory: .

  deploy:
    name: publish to the Vultr VM
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-build
          path: frontend/build

      - name: Install SSH key and host key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Publish backend, contracts and frontend; restart quarantine-api
        env:
          VM_HOST: ${{ vars.VM_HOST }}
        run: |
          bash infra/scripts/publish.sh \
            --host "$VM_HOST" \
            --user deploy \
            --identity "$RUNNER_TEMP/deploy_key" \
            --frontend-build frontend/build

      - name: Remove SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key"
