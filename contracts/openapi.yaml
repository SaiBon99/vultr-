openapi: 3.1.0
info:
  title: Memory Quarantine Proxy
  version: 0.2.3
  description: |
    FROZEN Phase 0 contract. Owner: Coordinator. Backend implements it; frontend consumes it.
    Change only through an OpenSpec change in openspec/changes/.
    Canonical JSON, hash-chain, receipt-signing rules, Stage 0 and the rulebook: contracts/README.md.
    0.2.0 (D5, openspec/changes/refine-verdicts-and-rulebook): verdicts ALLOW / NEEDS_REVIEW / BLOCKED / FAIL_CLOSED, 13 rule flags, risk_score.
    0.2.1 (openspec/changes/add-crawl-endpoint): adds POST /crawl. Additive only; no existing shape changes.
    0.2.2 (openspec/changes/add-run-logs): adds CrawlResult.run_id and log_uri, optional Error.run_id, and GET /crawl/runs/{run_id}/log. Additive only.
servers:
  - url: http://localhost:8000
    description: Local (FastAPI also serves frontend/build at /ui)
security: []
tags:
  - name: proxy
    description: Called by the host and the sandboxed worker
  - name: review
    description: Called by the Quarantine Review UI
  - name: public
  - name: demo
    description: Pattern A Deal Desk runner (honeypot comparison of naive vs quarantined)
  - name: crawl
    description: One-page crawler agent, one disposable Docker sandbox per request
paths:
  /:
    get:
      tags: [public]
      operationId: getRoot
      summary: Redirects to the Review UI.
      responses:
        '307':
          description: Redirect to /ui/
          headers:
            Location:
              schema: { type: string, const: /ui/ }
  /crawl:
    post:
      tags: [crawl]
      operationId: crawlPage
      summary: Crawler agent - fetch one page and summarise it inside one disposable sandbox.
      description: |
        One request starts one Docker container, runs one crawler agent and removes the container before the response.
        The container runs under the same caps as /demo/run (SANDBOX_MAX_MEMORY_MB, SANDBOX_MAX_CPUS, SANDBOX_TIMEOUT_S),
        with no network, no credentials, a read-only root filesystem, a non-root user, no capabilities and no mounts.
        The host brokers the two outside calls over the container's stdin and stdout: the page fetch (public-target
        guard on every redirect hop, size and type caps, logged on the host) and the model call (Vultr Serverless
        Inference, CRAWLER_MODEL, at most 512 output tokens; the key never enters the container).
        At most 2 runs at once; a third concurrent request gets 503 sandbox_busy. One attempt, no retry.
        The call blocks until the run ends. /crawl never writes memory.
        Every run that took a sandbox slot gets a run_id and writes one redacted NDJSON transcript to Object Storage
        (contracts/README.md wire rule 6), on success and on failure. The upload is best effort and never changes the
        response: log_uri is null when storage is missing or the upload failed. 502 and 504 bodies carry run_id;
        422 and 503 refusals happen before a slot is taken and carry none.
      security:
        - ReviewerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrawlRequest' }
      responses:
        '200':
          description: Page fetched and summarised
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrawlResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: Invalid body (code validation_error), or a URL that is not a public http(s) target (code unsafe_target)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: |
            No partial summary is returned. Codes: fetch_failed (connection, upstream status or redirect cap),
            page_too_large (over CRAWL_MAX_BYTES), unsupported_content (not HTML or text), inference_failed (model
            call failed or no completion id), model_output_invalid (reply is not the required JSON shape),
            sandbox_failed (container did not start, or exited non-zero before speaking the protocol),
            agent_crash (agent exited without a result line, or sent a malformed or unknown message).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Inference key not configured on this host (code inference_not_configured), or 2 runs already in progress (code sandbox_busy)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '504':
          description: The sandbox hit SANDBOX_TIMEOUT_S (clock starts at container start) and was killed and removed (code timeout)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /crawl/runs/{run_id}/log:
    get:
      tags: [crawl]
      operationId: getCrawlRunLog
      summary: The stored transcript of one /crawl run, byte for byte as written (contracts/README.md wire rule 6).
      security:
        - ReviewerToken: []
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: NDJSON, one JSON object per line; run_start first, run_end last
          content:
            application/x-ndjson:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No transcript for this run_id (code not_found)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Object Storage is not configured on this host (code storage_missing), or it did not answer (code storage_unavailable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /demo/run:
    post:
      tags: [demo]
      operationId: runDemo
      summary: Pattern A - run the Deal Desk agent once inside a capped, disposable sandbox.
      description: |
        The sandbox gets 512 MB, 1 CPU and 30 s (SANDBOX_MAX_MEMORY_MB, SANDBOX_MAX_CPUS, SANDBOX_TIMEOUT_S), zero DB, S3
        or LLM credentials, and no direct egress; it reaches memory only through /proxy/* with a host-minted session token.
        The sandbox is destroyed after each run; one retry is allowed when the first attempt fails on stderr.
        gate_mode=naive returns 403 unless DEMO_ALLOW_NAIVE=true. The call blocks until the run ends (at most ~2 x timeout).
      security:
        - ReviewerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DemoRunRequest' }
      responses:
        '200':
          description: Run finished (completed, failed or timeout)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /demo/runs:
    get:
      tags: [demo]
      operationId: listDemoRuns
      security:
        - ReviewerToken: []
      responses:
        '200':
          description: Past runs, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoRunList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /health:
    get:
      tags: [public]
      operationId: getHealth
      responses:
        '200':
          description: Readiness of each dependency
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /proxy/sessions:
    post:
      tags: [proxy]
      operationId: createSession
      summary: Host mints a session; the sandbox only ever sees session_token.
      description: |
        gate_mode=naive is rejected with 403 unless DEMO_ALLOW_NAIVE=true AND a valid X-Reviewer-Token is sent.
        Every naive session is logged to audit_events (event_type session_created, payload.gate_mode=naive).
      security:
        - HostSecret: []
      parameters:
        - $ref: '#/components/parameters/ReviewerTokenOptional'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSessionRequest' }
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateSessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /proxy/read:
    post:
      tags: [proxy]
      operationId: proxyRead
      summary: Register external content read by the worker; sets sticky session taint.
      description: Every source_kind (email, web, file, tool) taints the session permanently and resets sessions.writes_since_last_read to 0.
      security:
        - SessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProxyReadRequest' }
      responses:
        '200':
          description: Content registered; session is now tainted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProxyReadResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /proxy/memory/write:
    post:
      tags: [proxy]
      operationId: proxyMemoryWrite
      summary: Stage 0 + 13-flag deterministic gate. 201 when ALLOW, 202 when frozen.
      description: |
        The body carries no source or session_id: both are derived server-side from X-Session-Token,
        so a compromised sandbox cannot claim source='user'. Unknown fields are rejected (422).
        payload_hash covers the raw content bytes; the rules run on a Stage 0 inspection copy with zero-width,
        tag and bidi control characters removed. Frozen rows start with judge_status=pending.
      security:
        - SessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryWriteRequest' }
      responses:
        '201':
          description: ALLOW, promoted to memories (risk_score 0)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryWriteAccepted' }
        '202':
          description: Frozen in quarantine_queue (NEEDS_REVIEW, BLOCKED or FAIL_CLOSED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryWriteQuarantined' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /proxy/memory/active:
    get:
      tags: [proxy]
      operationId: proxyMemoryActive
      summary: Recall from memories ONLY, via the memory_reader role.
      description: Rows whose sha256(utf8(content)) does not equal payload_hash are excluded (PerMIT hash binding).
      security:
        - SessionToken: []
      parameters:
        - name: q
          in: query
          required: false
          description: Optional query text; when present results are ranked by pgvector cosine distance (<=>).
          schema: { type: string, maxLength: 2000 }
        - name: k
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: Active memories
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveMemories' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /quarantine:
    get:
      tags: [review]
      operationId: listQuarantine
      security:
        - ReviewerToken: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filter rows; omitted returns all statuses.
          schema: { $ref: '#/components/schemas/QuarantineStatus' }
      responses:
        '200':
          description: |
            Rows grouped by session_id. Items sort by (effective_priority_score DESC, created_at DESC);
            sessions sort by their highest item effective_priority_score, then created_at DESC.
            Use status=quarantined for the live review queue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuarantineList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /quarantine/{id}/decide:
    post:
      tags: [review]
      operationId: decideQuarantine
      summary: Purge or override one row; signs and uploads an Ed25519 receipt.
      description: |
        purge: sets status=purged, content=NULL; keeps payload_hash and embedding.
        override: verifies sha256(utf8(content)) == payload_hash (409 payload_hash_mismatch otherwise), then copies
        the row into memories with source='external_override', status=overridden.
        Override of a BLOCKED or FAIL_CLOSED row requires a non-blank reason (422 reason_required); optional for NEEDS_REVIEW.
        A row that is not status=quarantined returns 409 already_decided. Receipts are signed only here.
      security:
        - ReviewerToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecideRequest' }
      responses:
        '200':
          description: Decision applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecideResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /audit:
    get:
      tags: [review]
      operationId: getAudit
      security:
        - ReviewerToken: []
      parameters:
        - name: session_id
          in: query
          required: false
          description: Filter to one session. chain_valid is always computed over the FULL chain.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Hash-chained audit events, ascending seq
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /keys/public:
    get:
      tags: [public]
      operationId: getPublicKey
      responses:
        '200':
          description: Ed25519 receipt-signing public key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicKey' }
  /receipts/{id}:
    get:
      tags: [review]
      operationId: getReceipt
      security:
        - ReviewerToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: receipt_id
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Signed receipt as stored in Object Storage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    HostSecret:
      type: apiKey
      in: header
      name: X-Host-Secret
    SessionToken:
      type: apiKey
      in: header
      name: X-Session-Token
    ReviewerToken:
      type: apiKey
      in: header
      name: X-Reviewer-Token
  parameters:
    ReviewerTokenOptional:
      name: X-Reviewer-Token
      in: header
      required: false
      description: Required only when gate_mode=naive.
      schema: { type: string }
  responses:
    Unauthorized:
      description: Missing or invalid credential header
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Not allowed in this configuration
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Row already decided
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    CrawlRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          minLength: 8
          maxLength: 2048
          description: http or https only. Private, loopback, link-local and credentialed URLs are refused.
    CrawlLimits:
      type: object
      additionalProperties: false
      required: [memory_mb, cpus, timeout_s]
      properties:
        memory_mb: { type: integer, minimum: 1 }
        cpus: { type: integer, minimum: 1 }
        timeout_s: { type: integer, minimum: 1 }
    CrawlSandbox:
      type: object
      additionalProperties: false
      required: [runtime, container_id, image_id, network, limits]
      properties:
        runtime: { type: string, const: docker }
        container_id: { type: string, pattern: '^[0-9a-f]{64}$', description: Full container id from the run; the container is already removed }
        image_id: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        network: { type: string, const: none }
        limits: { $ref: '#/components/schemas/CrawlLimits' }
    CrawlUsage:
      type: object
      additionalProperties: false
      properties:
        prompt_tokens: { type: integer, minimum: 0 }
        completion_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
    CrawlResult:
      type: object
      additionalProperties: false
      required: [url, final_url, title, summary, key_points, model, inference_id, usage, elapsed_ms, sandbox, run_id, log_uri, pages]
      properties:
        url: { type: string, format: uri }
        final_url: { type: string, format: uri, description: URL after redirects; every hop was SSRF-checked }
        title: { type: string, maxLength: 300 }
        summary: { type: string, maxLength: 1000 }
        key_points:
          type: array
          maxItems: 5
          items: { type: string, maxLength: 300 }
        model: { type: string }
        inference_id: { type: string, minLength: 1, description: Completion id returned by Vultr Serverless Inference }
        usage:
          anyOf:
            - { $ref: '#/components/schemas/CrawlUsage' }
            - { type: 'null' }
        elapsed_ms: { type: integer, minimum: 0 }
        sandbox: { $ref: '#/components/schemas/CrawlSandbox' }
        run_id: { type: string, format: uuid }
        log_uri:
          type: [string, 'null']
          description: s3://<bucket>/logs/crawl/<run_id>.jsonl, or null when Object Storage is missing or the upload failed
        pages:
          type: array
          description: Seed first, then planner-chosen links in visit order. Skipped and failed links are listed with an error code and do not fail the run.
          items: { $ref: '#/components/schemas/CrawlPage' }
    CrawlPage:
      type: object
      additionalProperties: false
      required: [url, final_url, status]
      properties:
        url: { type: string, format: uri }
        final_url: { type: [string, 'null'], format: uri }
        status: { type: string, enum: [ok, skipped, failed] }
        title: { type: [string, 'null'], maxLength: 300 }
        error: { type: [string, 'null'], description: Error code or reason for a skipped or failed link }
    DemoRunRequest:
      type: object
      additionalProperties: false
      required: [scenario, gate_mode]
      properties:
        scenario:
          type: string
          enum: [research_then_quote, benign_quote]
          description: research_then_quote reads the seeded poisoned email in session 1, then quotes in session 2
        gate_mode: { $ref: '#/components/schemas/GateMode' }
    DemoRunStatus:
      type: string
      enum: [completed, failed, timeout]
    DemoRun:
      type: object
      additionalProperties: false
      required: [run_id, scenario, gate_mode, session_ids, status, attempts, exit_code, stdout, stderr, quote_output, containment, limits, started_at, finished_at]
      properties:
        run_id: { type: string, format: uuid }
        scenario: { type: string }
        gate_mode: { $ref: '#/components/schemas/GateMode' }
        session_ids:
          type: array
          items: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/DemoRunStatus' }
        attempts: { type: integer, minimum: 1, maximum: 2 }
        exit_code: { type: [integer, 'null'] }
        stdout: { type: string, maxLength: 65536 }
        stderr: { type: string, maxLength: 65536 }
        quote_output: { type: [string, 'null'], description: Quote text the agent produced in the quoting session }
        containment:
          type: object
          additionalProperties: false
          required: [leaked, outbound_attempts, quarantined_writes, blocked_egress]
          properties:
            leaked: { type: boolean, description: A canary token reached the fake send_email sink }
            outbound_attempts: { type: integer, minimum: 0 }
            quarantined_writes: { type: integer, minimum: 0 }
            blocked_egress:
              type: array
              items: { type: string }
              description: Direct connections the sandbox attempted and was denied (host:port)
        limits:
          type: object
          additionalProperties: false
          required: [memory_mb, cpus, timeout_s]
          properties:
            memory_mb: { type: integer }
            cpus: { type: integer }
            timeout_s: { type: integer }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    DemoRunList:
      type: object
      additionalProperties: false
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: '#/components/schemas/DemoRun' }
    Error:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail: { type: string }
        code:
          type: string
          description: Machine-readable code, e.g. reason_required, already_decided, payload_hash_mismatch, naive_disabled
        run_id:
          type: string
          format: uuid
          description: Set on /crawl 502 and 504; the transcript is at GET /crawl/runs/{run_id}/log
    HealthCheck:
      type: string
      enum: [ok, error, skipped]
    Health:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          additionalProperties: false
          required: [db, object_storage, inference]
          properties:
            db: { $ref: '#/components/schemas/HealthCheck' }
            object_storage: { $ref: '#/components/schemas/HealthCheck' }
            inference: { $ref: '#/components/schemas/HealthCheck' }
    GateMode:
      type: string
      enum: [quarantined, naive]
    Verdict:
      type: string
      description: ALLOW is never stored in quarantine_queue. Precedence FAIL_CLOSED > BLOCKED > NEEDS_REVIEW > ALLOW.
      enum: [ALLOW, NEEDS_REVIEW, BLOCKED, FAIL_CLOSED]
    FrozenVerdict:
      type: string
      enum: [NEEDS_REVIEW, BLOCKED, FAIL_CLOSED]
    RiskScore:
      type: integer
      minimum: 0
      maximum: 100
      description: Deterministic min(100, sum of rule weights); 0 for ALLOW; floor 85 for FAIL_CLOSED. See x-rulebook on RuleFlag.
    RuleFlag:
      type: string
      description: |
        13 core detectors. Verdict tier per flag and weights are in x-rulebook (machine-readable; backend gate,
        frontend badges and contracts/check_contracts.py all read it). Rules run on the Stage 0 inspection copy.
      enum:
        - tainted_session
        - immediate_write_after_read
        - write_burst
        - overwrite_attempt
        - imperative_directive
        - external_email
        - external_url
        - sensitive_tool
        - canary_overlap
        - poison_similarity
        - missing_provenance
        - invalid_schema
        - judge_failed
      x-rulebook:
        precedence: [FAIL_CLOSED, BLOCKED, NEEDS_REVIEW, ALLOW]
        max_clean_writes: 3
        fail_closed_floor: 85
        judge_priority_boost: 15
        judge_boost_when:
          recommended_action: purge
          risk_level: [high, critical]
        flags:
          tainted_session: { verdict: NEEDS_REVIEW, weight: 25 }
          immediate_write_after_read: { verdict: NEEDS_REVIEW, weight: 10 }
          write_burst: { verdict: NEEDS_REVIEW, weight: 15 }
          overwrite_attempt: { verdict: NEEDS_REVIEW, weight: 25 }
          imperative_directive: { verdict: BLOCKED, weight: 40 }
          external_email: { verdict: BLOCKED, weight: 45 }
          external_url: { verdict: BLOCKED, weight: 45 }
          sensitive_tool: { verdict: BLOCKED, weight: 45 }
          canary_overlap: { verdict: BLOCKED, weight: 90 }
          poison_similarity: { verdict: BLOCKED, weight: 90 }
          missing_provenance: { verdict: FAIL_CLOSED, weight: 0 }
          invalid_schema: { verdict: FAIL_CLOSED, weight: 0 }
          judge_failed: { verdict: FAIL_CLOSED, weight: 0 }
    QuarantineStatus:
      type: string
      enum: [quarantined, purged, overridden]
    JudgeStatus:
      type: string
      enum: [pending, done, failed]
    SourceKind:
      type: string
      enum: [email, web, file, tool]
    PayloadHash:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
    CreateSessionRequest:
      type: object
      additionalProperties: false
      properties:
        gate_mode: { $ref: '#/components/schemas/GateMode' }
        label:
          type: string
          maxLength: 120
          description: Free-text label shown in the Review UI (e.g. "Session 1 - research")
    CreateSessionResponse:
      type: object
      additionalProperties: false
      required: [session_id, session_token, gate_mode, created_at]
      properties:
        session_id: { type: string, format: uuid }
        session_token: { type: string, description: Opaque; only sha256(token) is stored }
        gate_mode: { $ref: '#/components/schemas/GateMode' }
        created_at: { type: string, format: date-time }
    ExternalSource:
      type: object
      additionalProperties: false
      required: [source_ref, source_kind, read_at]
      properties:
        source_ref: { type: string }
        source_kind: { $ref: '#/components/schemas/SourceKind' }
        read_at: { type: string, format: date-time }
    ProxyReadRequest:
      type: object
      additionalProperties: false
      required: [source_ref, source_kind]
      properties:
        source_ref:
          type: string
          maxLength: 2048
          description: URL, message id (e.g. email:msg-001) or file path
        source_kind: { $ref: '#/components/schemas/SourceKind' }
        content:
          type: string
          maxLength: 200000
          description: Inline content (demo/mocks). When omitted for web, the proxy fetches source_ref.
    ProxyReadResponse:
      type: object
      additionalProperties: false
      required: [source_ref, source_kind, content, tainted]
      properties:
        source_ref: { type: string }
        source_kind: { $ref: '#/components/schemas/SourceKind' }
        content: { type: string }
        tainted: { type: boolean, const: true }
    MemoryWriteRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 8000 }
        overwrite_id:
          type: string
          format: uuid
          description: Present when the worker tries to update an existing active memory (always frozen, overwrite_attempt).
    MemoryWriteAccepted:
      type: object
      additionalProperties: false
      required: [status, verdict, risk_score, memory_id, payload_hash]
      properties:
        status: { type: string, const: active }
        verdict: { type: string, const: ALLOW }
        risk_score: { type: integer, const: 0 }
        memory_id: { type: string, format: uuid }
        payload_hash: { $ref: '#/components/schemas/PayloadHash' }
    MemoryWriteQuarantined:
      type: object
      additionalProperties: false
      required: [status, verdict, risk_score, quarantine_id, payload_hash, rule_flags]
      properties:
        status: { type: string, const: quarantined }
        verdict: { $ref: '#/components/schemas/FrozenVerdict' }
        risk_score: { $ref: '#/components/schemas/RiskScore' }
        quarantine_id: { type: string, format: uuid }
        payload_hash: { $ref: '#/components/schemas/PayloadHash' }
        rule_flags:
          type: array
          items: { $ref: '#/components/schemas/RuleFlag' }
    ActiveMemory:
      type: object
      additionalProperties: false
      required: [id, session_id, content, source, source_ref, payload_hash, created_at]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        content: { type: string }
        source: { type: string, enum: [user, external_override] }
        source_ref: { type: [string, 'null'] }
        payload_hash: { $ref: '#/components/schemas/PayloadHash' }
        created_at: { type: string, format: date-time }
        distance:
          type: [number, 'null']
          description: Cosine distance to q (null when q is omitted)
    ActiveMemories:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ActiveMemory' }
    JudgeNote:
      description: Strict judge JSON. Mirrors contracts/judge.schema.json.
      type: object
      additionalProperties: false
      required: [summary, risk_level, recommended_action, indicators]
      properties:
        summary: { type: string, maxLength: 500 }
        risk_level: { type: string, enum: [low, medium, high, critical] }
        recommended_action: { type: string, enum: [purge, override] }
        indicators:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 120 }
    QuarantineItem:
      type: object
      additionalProperties: false
      required:
        - id
        - session_id
        - status
        - content
        - payload_hash
        - source
        - source_ref
        - source_snippet
        - verdict
        - risk_score
        - effective_priority_score
        - rule_flags
        - judge_status
        - judge_note
        - override_reason
        - decided_by
        - decided_at
        - receipt_uri
        - receipt_id
        - created_at
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/QuarantineStatus' }
        content: { type: [string, 'null'], description: null once purged }
        payload_hash: { $ref: '#/components/schemas/PayloadHash' }
        source: { type: string, enum: [user, external] }
        source_ref: { type: [string, 'null'] }
        source_snippet:
          type: [string, 'null']
          description: Up to 600 chars of the external content read in this session that matches source_ref
        verdict: { $ref: '#/components/schemas/FrozenVerdict' }
        risk_score: { $ref: '#/components/schemas/RiskScore' }
        effective_priority_score:
          type: integer
          minimum: 0
          maximum: 115
          description: risk_score + 15 when judge_note recommends purge at high or critical risk; sort key only
        rule_flags:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/RuleFlag' }
        judge_status: { $ref: '#/components/schemas/JudgeStatus' }
        judge_note:
          oneOf:
            - $ref: '#/components/schemas/JudgeNote'
            - type: 'null'
        override_reason: { type: [string, 'null'] }
        decided_by: { type: [string, 'null'] }
        decided_at: { type: [string, 'null'], format: date-time }
        receipt_uri: { type: [string, 'null'] }
        receipt_id: { type: [string, 'null'], format: uuid, description: 'Latest receipt for this row (fetch via /receipts/{id})' }
        created_at: { type: string, format: date-time }
    QuarantineSessionGroup:
      type: object
      additionalProperties: false
      required: [session_id, label, gate_mode, tainted, external_sources, write_count, created_at, items]
      properties:
        session_id: { type: string, format: uuid }
        label: { type: [string, 'null'] }
        gate_mode: { $ref: '#/components/schemas/GateMode' }
        tainted: { type: boolean }
        external_sources:
          type: array
          items: { $ref: '#/components/schemas/ExternalSource' }
        write_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/QuarantineItem' }
    QuarantineList:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: '#/components/schemas/QuarantineSessionGroup' }
    DecideRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [purge, override] }
        reason:
          type: string
          maxLength: 1000
          description: Required (non-blank) when overriding a BLOCKED or FAIL_CLOSED row; optional for NEEDS_REVIEW
    DecideResponse:
      type: object
      additionalProperties: false
      required: [item, receipt, memory_id]
      properties:
        item: { $ref: '#/components/schemas/QuarantineItem' }
        receipt: { $ref: '#/components/schemas/Receipt' }
        memory_id:
          type: [string, 'null']
          format: uuid
          description: New memories.id on override; null on purge
    AuditEvent:
      type: object
      additionalProperties: false
      required: [seq, session_id, event_type, target_id, payload, prev_hash, event_hash, created_at]
      properties:
        seq: { type: integer, minimum: 1 }
        session_id: { type: [string, 'null'], format: uuid }
        event_type:
          type: string
          enum:
            - session_created
            - external_read
            - memory_promoted
            - memory_quarantined
            - judge_completed
            - judge_failed
            - decision_purged
            - decision_overridden
            - receipt_signed
        target_id: { type: [string, 'null'], format: uuid }
        payload: { type: object }
        prev_hash: { $ref: '#/components/schemas/PayloadHash' }
        event_hash: { $ref: '#/components/schemas/PayloadHash' }
        created_at: { type: string, description: 'RFC 3339 UTC, microseconds, Z suffix (YYYY-MM-DDTHH:MM:SS.ffffffZ)' }
    AuditLog:
      type: object
      additionalProperties: false
      required: [events, chain_valid, head_hash]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        chain_valid: { type: boolean }
        head_hash: { $ref: '#/components/schemas/PayloadHash' }
        first_invalid_seq: { type: [integer, 'null'] }
    PublicKey:
      type: object
      additionalProperties: false
      required: [alg, key_id, public_key_b64, jwk]
      properties:
        alg: { type: string, const: Ed25519 }
        key_id: { type: string, description: 'sha256:<hex> of the raw 32-byte public key, first 16 hex chars' }
        public_key_b64: { type: string, description: Standard base64 of the raw 32-byte key }
        jwk:
          type: object
          additionalProperties: false
          required: [kty, crv, x]
          properties:
            kty: { type: string, const: OKP }
            crv: { type: string, const: Ed25519 }
            x: { type: string, description: 'base64url, no padding' }
    Receipt:
      description: Mirrors contracts/receipt.schema.json.
      type: object
      additionalProperties: false
      required:
        - receipt_id
        - event
        - quarantine_id
        - session_id
        - verdict
        - risk_score
        - rule_flags
        - payload_hash
        - audit_head_hash
        - override_reason
        - timestamp
        - key_id
        - signature_alg
        - signature_b64
      properties:
        receipt_id: { type: string, format: uuid }
        event: { type: string, enum: [purged, overridden] }
        quarantine_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        verdict: { $ref: '#/components/schemas/FrozenVerdict' }
        risk_score: { $ref: '#/components/schemas/RiskScore' }
        rule_flags:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/RuleFlag' }
        payload_hash: { $ref: '#/components/schemas/PayloadHash' }
        audit_head_hash: { $ref: '#/components/schemas/PayloadHash' }
        override_reason: { type: [string, 'null'] }
        timestamp: { type: string, description: 'RFC 3339 UTC, seconds, Z suffix' }
        key_id: { type: string }
        signature_alg: { type: string, const: Ed25519 }
        signature_b64: { type: string }
