# Local Postgres (pgvector) + MinIO. Values come from infra/.env, with safe local defaults.
name: quarantine
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-quarantine}
      PROXY_DB_PASSWORD: ${PROXY_DB_PASSWORD:-proxy_local_pw}
      READER_DB_PASSWORD: ${READER_DB_PASSWORD:-reader_local_pw}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/sql:ro
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./docker/002_roles_login.sh:/docker-entrypoint-initdb.d/002_roles_login.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
  # minio/minio and quay.io/minio/minio are no longer pullable; chainguard builds the same MinIO server.
  minio:
    image: chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
  # One-shot bucket creation, idempotent. The image has no shell, so it retries via restart until MinIO is up.
  minio-init:
    image: chainguard/minio-client:latest
    depends_on:
      - minio
    restart: on-failure
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY:-minioadmin}:${S3_SECRET_KEY:-minioadmin}@minio:9000
    command: ["mb", "--ignore-existing", "local/${S3_BUCKET:-quarantine-receipts}"]
volumes:
  pgdata:
  miniodata:
