[project]
name = "memory-quarantine-backend"
version = "0.1.0"
description = "Memory Quarantine Proxy: gated agent memory writes, quarantine, signed receipts"
readme = "AGENTS.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "openai>=1.40",
  "boto3>=1.35",
  "cryptography>=43",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "jsonschema>=4.23",
  "pyyaml>=6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["docker: needs a running Docker daemon and the built sandbox image (skipped otherwise)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
